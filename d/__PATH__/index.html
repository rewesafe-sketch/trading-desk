<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png" />
  <link rel="manifest" href="../../manifest.json" />
  <title>Grok Bot</title>
  <link rel="stylesheet" href="../../app.css?v=4" />
</head>
<body>
  <div id="app">
    <div id="error-bar" role="status"></div>

    <!-- HOME -->
    <section class="screen active" data-tab="home" id="screen-home">
      <div class="navbar">
        <button type="button" class="nav-avatar" id="nav-avatar" aria-label="Account">GB</button>
        <button type="button" class="nav-title" id="nav-title">Grok Bot <span class="chev">›</span></button>
        <input class="nav-search" id="nav-search" type="search" placeholder="Search name, symbol, mint" enterkeyhint="search" />
        <button type="button" class="nav-icon" id="nav-bell" aria-label="Notifications">🔔<span class="bell-dot" id="bell-dot"></span></button>
      </div>
      <div class="screen-scroll">
        <div class="balance-row">
          <div class="balance-odometer tabular" id="balance-odometer">—</div>
          <span class="paper-pill" id="paper-pill-home">PAPER</span>
        </div>
        <div class="today-row">
          <span id="today-pct" class="tabular">—</span>
          <span class="mult-pill tabular" id="mult-pill">—×</span>
        </div>
        <div class="chart-wrap">
          <div class="chart-empty" id="chart-empty">Waiting for the first trade</div>
          <canvas id="home-chart"></canvas>
          <div class="range-switch">
            <button type="button" data-range="LIVE" class="on">LIVE</button>
            <button type="button" data-range="1H">1H</button>
            <button type="button" data-range="4H">4H</button>
            <button type="button" data-range="1D">1D</button>
            <button type="button" data-range="1W">1W</button>
            <button type="button" data-range="ALL">ALL</button>
          </div>
        </div>
        <div class="section-head"><span id="agents-heading">Agents · 5 running</span></div>
        <div class="agent-carousel" id="agent-carousel"></div>
        <div class="section-head">
          <span>Activity</span>
          <button type="button" class="link" id="see-all-activity">See all</button>
        </div>
        <div id="home-activity"></div>
      </div>
    </section>

    <!-- AGENTS -->
    <section class="screen" data-tab="agents" id="screen-agents">
      <div class="navbar"><div class="nav-title">Agents</div></div>
      <div class="screen-scroll" id="agents-list"></div>
    </section>

    <!-- ACTIVITY -->
    <section class="screen" data-tab="activity" id="screen-activity">
      <div class="navbar"><div class="nav-title">Activity</div></div>
      <div class="screen-scroll" id="activity-list"></div>
    </section>

    <!-- ACCOUNT -->
    <section class="screen" data-tab="account" id="screen-account">
      <div class="navbar"><div class="nav-title">Account</div></div>
      <div class="screen-scroll">
        <div class="note-box" id="planb-settings-note">Settings are read-only here. Change them via Telegram.</div>
        <div class="acct-card">
          <div class="acct-row">
            <span class="label">Mode</span>
            <div class="mode-seg" id="acct-mode"><span class="on">PAPER</span><span>LIVE</span></div>
          </div>
          <div class="acct-row">
            <span class="label">Stack</span>
            <span class="value tabular" id="acct-stack">—</span>
          </div>
        </div>
        <div class="acct-card">
          <a class="acct-row" id="acct-profile" href="#" target="_blank" rel="noopener">
            <span class="label">Your FOMO profile</span>
            <span><span class="value"></span> <span class="chev">›</span></span>
          </a>
          <button type="button" class="acct-row" id="acct-invite">
            <span class="label">Invite a friend</span>
            <span class="value">Share</span>
          </button>
        </div>
        <div class="acct-card">
          <div class="acct-row">
            <span class="label">Telegram</span>
            <span class="value" id="acct-telegram">—</span>
          </div>
          <div class="acct-row">
            <span class="label">Notifications</span>
            <span class="value" id="web-push-note" style="max-width:60%;text-align:right;font-size:12px">Telegram only</span>
          </div>
        </div>
        <div class="section-head"><span>Settings</span></div>
        <div id="settings-groups"></div>
      </div>
    </section>

    <!-- COIN overlay -->
    <div class="overlay-screen" id="coin-overlay">
      <div class="navbar">
        <button type="button" class="nav-back" id="coin-back" aria-label="Back">‹</button>
        <div class="nav-title">Coin</div>
      </div>
      <div id="coin-body" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
    </div>

    <!-- AUDIT overlay -->
    <div class="overlay-screen" id="audit-overlay">
      <div class="navbar">
        <button type="button" class="nav-back" id="audit-back" aria-label="Back">‹</button>
        <div class="nav-title">Auditor</div>
      </div>
      <div id="audit-body" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
    </div>

    <nav class="tabbar" aria-label="Tabs">
      <button type="button" data-tab="home" class="on"><span class="tab-ico">⌂</span>Home</button>
      <button type="button" data-tab="agents"><span class="tab-ico">◎</span>Agents</button>
      <button type="button" data-tab="activity"><span class="tab-ico">☰</span>Activity</button>
      <button type="button" data-tab="account"><span class="tab-ico">☺</span>Account</button>
    </nav>
  </div>
  <script src="../../chart.js?v=4"></script>
  <script src="../../app.js?v=4"></script>
</body>
</html>
