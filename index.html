<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Grok Bot</title>
  <style>
    html, body { margin: 0; background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  </style>
</head>
<body data-role="launcher">
  <div style="padding:40px;min-height:100vh">Open your new private desk link</div>
  <script>
    try { localStorage.removeItem('desk_data_path'); } catch (e) {}
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  </script>
</body>
</html>
